[package]
name = "pdn-aprs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "APRS encoder and decoder: every APRS 1.2 data type, strict or lenient decoding with named tolerances, no_std + alloc"
repository = "https://github.com/packet-net/aprs-rs"
readme = "README.md"
keywords = ["aprs", "ham-radio", "amateur-radio", "ax25", "decoder"]
categories = ["parser-implementations", "encoding", "no-std", "embedded"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/THIRD-PARTY-NOTICES.md"]

[dependencies]
libm = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"
serde_json = "1"
flate2 = "1"

[[test]]
name = "vectors"
harness = false
