name: publish

# Publishes the crate to crates.io when a v* tag is pushed (v0.1.0 publishes 0.1.0), then makes a
# GitHub release. The tag must match the version in Cargo.toml.
#
# Needs the CARGO_REGISTRY_TOKEN repository secret (a crates.io API token with publish rights).
# Without it the job still packages and checks the crate, then stops with an error that says so.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish pdn-aprs
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys, json; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Cargo.toml says $version but the tag is v$tag"
            exit 1
          fi
      - run: cargo test --locked
      - run: cargo package --locked
      - name: cargo publish
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is not set, so nothing was published. Add it under Settings, Secrets and variables, Actions, then re-run this job."
            exit 1
          fi
          cargo publish --locked
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" --title "${GITHUB_REF#refs/tags/}" --verify-tag \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md). On crates.io: https://crates.io/crates/pdn-aprs"
