name: publish

# Publishes the crate to crates.io when a v* tag is pushed (v0.1.0 publishes 0.1.0), then makes a
# GitHub release. The tag must match the version in Cargo.toml.
#
# Uses crates.io trusted publishing: no stored token. crates.io trusts this repository and this
# workflow file by name (pdn-aprs, Settings, Trusted Publishing), so keep the file called
# publish.yml. The auth step swaps GitHub's OIDC token for a short-lived crates.io one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish pdn-aprs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys, json; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Cargo.toml says $version but the tag is v$tag"
            exit 1
          fi
      - run: cargo test --locked
      - run: cargo package --locked
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" --title "${GITHUB_REF#refs/tags/}" --verify-tag \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md). On crates.io: https://crates.io/crates/pdn-aprs"
