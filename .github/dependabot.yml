version: 2
updates:
  # New conformance cases arrive as a pull request moving the vectors submodule on; CI shows
  # whether the crate still passes them.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
